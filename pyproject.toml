[build-system]
requires = ["uv-build>=0.5.0, <0.13.0"]
build-backend = "uv_build"

[project]
name = "actis"
version = "0.1.0"
description = "Adaptive Cascade Tuning via Importance Sampling"
readme = "README.md"
authors = [
    {name = "Neil Marchant", email = "nmarchant@unimelb.edu.au"},
]
license = { "file"= "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "numpy>=1.25.0,<3.0.0",
    "scipy",
    "pybind11>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.2",
    "pytest>=8.0.0",
]
reference = [
    "confseq",
]
experiments = [
    "plotnine",
    "datasets>=2.0.0",
    "bargain @ git+ssh://git@github.com/ngmarchant/BARGAIN.git@perf",
    "lotus-ai @ git+ssh://git@github.com/ngmarchant/lotus.git@perf",
    "scikit-learn",
    "torch",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pyarrow>=14.0.0",
    "py7zr>=0.20.0",
    "kagglehub>=0.3.0",
    "convokit>=3.1.0",
]

[tool.uv]
override-dependencies = [
    "pybind11>=2.12.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Active linting rules (Errors, Flake8, Isort imports, Warnings)
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]